<div class="page type-interior pluginConfigurationPage" data-role="page" id="SeerrDiscoveryPage">
    <style>
        .discovery-page { max-width: 1200px; margin: 0 auto; padding: 1em; font-family: inherit; }
        .discovery-page h2 { margin: 0 0 0.5em 0; display: flex; align-items: center; gap: 0.4em; }
        .discovery-page .material-icons { font-size: 1.3em; }
        .discovery-disabled { text-align: center; padding: 3em; opacity: 0.6; }
        .discovery-empty { text-align: center; padding: 2em; opacity: 0.5; }
        .discovery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1em; }
        .discovery-card { background: rgba(255,255,255,0.05); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; transition: opacity 0.3s, transform 0.3s; }
        .discovery-card-removing { opacity: 0; transform: scale(0.95); }
        .discovery-card-poster img { width: 100%; height: 160px; object-fit: cover; display: block; }
        .discovery-card-poster-empty { width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); opacity: 0.3; }
        .discovery-card-body { padding: 0.8em; flex: 1; display: flex; flex-direction: column; gap: 0.4em; }
        .discovery-card-title { font-weight: 600; font-size: 0.95em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .discovery-card-meta { display: flex; flex-wrap: wrap; gap: 0.3em; }
        .discovery-tag { background: rgba(255,255,255,0.1); border-radius: 4px; padding: 0.15em 0.5em; font-size: 0.75em; }
        .discovery-score { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin: 0.3em 0; }
        .discovery-score-bar { height: 100%; border-radius: 2px; }
        .discovery-score-high .discovery-score-bar { background: #2ecc71; }
        .discovery-score-mid .discovery-score-bar { background: #f39c12; }
        .discovery-score-low .discovery-score-bar { background: #e74c3c; }
        .discovery-score-text { font-size: 0.7em; opacity: 0.6; }
        .discovery-card-reason { font-size: 0.78em; opacity: 0.7; }
        .discovery-request-btn { margin-top: auto; padding: 0.5em; border: none; border-radius: 4px; background: #00a4dc; color: #fff; cursor: pointer; font-size: 0.85em; display: flex; align-items: center; justify-content: center; gap: 0.3em; transition: background 0.2s; }
        .discovery-request-btn:hover { background: #0090c4; }
        .discovery-request-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .discovery-request-done { background: #2ecc71 !important; }
        .discovery-footer { margin-top: 1em; font-size: 0.8em; opacity: 0.5; text-align: center; }
        .discovery-spinner { display: flex; justify-content: center; padding: 2em; }
        .discovery-spinner::after { content: ''; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #00a4dc; border-radius: 50%; animation: dspin 0.8s linear infinite; }
        @keyframes dspin { to { transform: rotate(360deg); } }
    </style>

    <div data-role="content">
        <div class="discovery-page">
            <h2><span class="material-icons">explore</span> Seerr Discovery</h2>
            <div id="discoveryPageContent">
                <div class="discovery-spinner"></div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        (function () {
            'use strict';
            var API_BASE = window.ApiClient ? '' : '';
            var _cache = null;
            var _cacheTime = 0;
            var TTL = 5 * 60 * 1000;

            function getApiHeaders() {
                var headers = { 'Content-Type': 'application/json' };
                if (window.ApiClient && window.ApiClient.accessToken()) {
                    headers['Authorization'] = 'MediaBrowser Token="' + window.ApiClient.accessToken() + '"';
                }
                return headers;
            }

            function apiUrl(path) {
                var base = (window.ApiClient && window.ApiClient.serverAddress) ? window.ApiClient.serverAddress() : '';
                return base + '/' + path;
            }

            function load() {
                var container = document.getElementById('discoveryPageContent');
                if (!container) return;

                if (_cache && (Date.now() - _cacheTime) < TTL) {
                    render(container, _cache);
                    return;
                }

                container.innerHTML = '<div class="discovery-spinner"></div>';

                fetch(apiUrl('JellyfinHelper/Discovery/My'), { headers: getApiHeaders() })
                    .then(function (res) {
                        if (res.status === 403) {
                            container.innerHTML = '<div class="discovery-disabled"><p>Discovery is not enabled. Please ask your server administrator to enable this feature.</p></div>';
                            return null;
                        }
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(function (data) {
                        if (data === null) return;
                        _cache = data;
                        _cacheTime = Date.now();
                        render(container, data);
                    })
                    .catch(function () {
                        container.innerHTML = '<div class="discovery-empty"><p>Could not load discovery suggestions.</p></div>';
                    });
            }

            function render(container, userDiscovery) {
                if (!userDiscovery || !userDiscovery.Recommendations || userDiscovery.Recommendations.length === 0) {
                    container.innerHTML = '<div class="discovery-empty"><p>No suggestions available yet. Results will appear after the next scheduled task run.</p></div>';
                    return;
                }

                var recs = userDiscovery.Recommendations;
                var html = '<div class="discovery-grid">';
                for (var i = 0; i < recs.length; i++) {
                    html += renderCard(recs[i]);
                }
                html += '</div>';

                if (userDiscovery.GeneratedAt) {
                    var d = new Date(userDiscovery.GeneratedAt);
                    html += '<div class="discovery-footer">Last updated: ' + d.toLocaleDateString() + ' ' + d.toLocaleTimeString() + '</div>';
                }

                container.innerHTML = html;
                var btns = container.querySelectorAll('.discovery-request-btn:not(:disabled)');
                for (var b = 0; b < btns.length; b++) {
                    btns[b].addEventListener('click', handleRequest);
                }
            }

            function renderCard(rec) {
                var scorePercent = Math.max(0, Math.min(100, Math.round((Number(rec.Score) || 0) * 100)));
                var scoreClass = scorePercent >= 80 ? 'discovery-score-high' : scorePercent >= 50 ? 'discovery-score-mid' : 'discovery-score-low';
                var poster = rec.PosterPath ? 'https://image.tmdb.org/t/p/w185' + esc(rec.PosterPath) : '';

                var h = '<div class="discovery-card">';
                if (poster) {
                    h += '<div class="discovery-card-poster"><img src="' + poster + '" alt="" loading="lazy"></div>';
                } else {
                    h += '<div class="discovery-card-poster-empty"><span class="material-icons">image</span></div>';
                }
                h += '<div class="discovery-card-body">';
                h += '<div class="discovery-card-title">' + esc(rec.Title || 'Unknown') + '</div>';
                h += '<div class="discovery-card-meta">';
                if (rec.MediaType) h += '<span class="discovery-tag">' + esc(rec.MediaType === 'tv' ? 'Series' : 'Movie') + '</span>';
                if (rec.Genres) { for (var g = 0; g < Math.min(rec.Genres.length, 2); g++) h += '<span class="discovery-tag">' + esc(rec.Genres[g]) + '</span>'; }
                if (rec.Year) h += '<span class="discovery-tag">' + rec.Year + '</span>';
                if (rec.TmdbRating) h += '<span class="discovery-tag">' + rec.TmdbRating.toFixed(1) + '</span>';
                h += '</div>';
                h += '<div class="discovery-score ' + scoreClass + '"><div class="discovery-score-bar" style="width:' + scorePercent + '%"></div></div>';
                h += '<div class="discovery-score-text">' + scorePercent + '% match</div>';

                if (rec.AlreadyRequested) {
                    h += '<button class="discovery-request-btn discovery-request-done" disabled><span class="material-icons" style="font-size:1em;">check_circle</span> Requested</button>';
                } else {
                    h += '<button class="discovery-request-btn" data-tmdb="' + rec.TmdbId + '" data-type="' + esc(rec.MediaType || 'movie') + '"><span class="material-icons" style="font-size:1em;">cloud_download</span> Request</button>';
                }
                h += '</div></div>';
                return h;
            }

            function handleRequest(e) {
                var btn = e.currentTarget;
                if (btn.disabled) return;
                var tmdbId = parseInt(btn.getAttribute('data-tmdb'), 10);
                var mediaType = btn.getAttribute('data-type');
                if (!tmdbId || !mediaType) return;

                btn.disabled = true;
                btn.innerHTML = '<div class="discovery-spinner" style="padding:0;"></div>';

                fetch(apiUrl('JellyfinHelper/Discovery/My/Request'), {
                    method: 'POST',
                    headers: getApiHeaders(),
                    body: JSON.stringify({ TmdbId: tmdbId, MediaType: mediaType })
                })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data && data.Success) {
                        btn.classList.add('discovery-request-done');
                        btn.innerHTML = '<span class="material-icons" style="font-size:1em;">check_circle</span> Requested';
                        // Update cache
                        if (_cache && _cache.Recommendations) {
                            for (var r = 0; r < _cache.Recommendations.length; r++) {
                                if (_cache.Recommendations[r].TmdbId === tmdbId) {
                                    _cache.Recommendations[r].AlreadyRequested = true;
                                }
                            }
                        }
                        // Fade out card
                        var card = btn.closest('.discovery-card');
                        if (card) {
                            setTimeout(function () {
                                card.classList.add('discovery-card-removing');
                                setTimeout(function () { card.remove(); }, 300);
                            }, 800);
                        }
                    } else {
                        btn.disabled = false;
                        btn.innerHTML = '<span class="material-icons" style="font-size:1em;">error</span> Failed';
                        setTimeout(function () {
                            btn.innerHTML = '<span class="material-icons" style="font-size:1em;">cloud_download</span> Request';
                        }, 3000);
                    }
                })
                .catch(function () {
                    btn.disabled = false;
                    btn.innerHTML = '<span class="material-icons" style="font-size:1em;">error</span> Failed';
                    setTimeout(function () {
                        btn.innerHTML = '<span class="material-icons" style="font-size:1em;">cloud_download</span> Request';
                    }, 3000);
                });
            }

            function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

            // Auto-init when page becomes visible
            if (document.getElementById('discoveryPageContent')) {
                load();
            } else {
                document.addEventListener('viewshow', function () { if (document.getElementById('discoveryPageContent')) load(); });
            }
        })();
    </script>
</div>
