language: "en"
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  # Skip generated or metadata-only files: they add no review value and consume CodeRabbit's per-PR file budget.
  path_filters:
    - "!**/*.md"
    - "!**/*.yaml"
    - "!**/*.yml"
    - "!**/Dockerfile*"
    - "!**/*.ps1"
    - "!manifest.json"
    - "!mock-data.js"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
chat:
  auto_reply: true