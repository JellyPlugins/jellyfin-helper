language: "en"
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  # Exclude generated files and documentation from review.
  # i18n is excluded to stay within the review file limit; key/genre tests remain active.
  path_filters:
    - "!**/*.md"
    - "!**/PluginPages/configPage.html"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/node_modules/**"
    - "!docs/**"
    - "!manifest.json"
    - "!Jellyfin.Plugin.JellyfinHelper/i18n/**"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
chat:
  auto_reply: true
