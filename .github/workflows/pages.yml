name: Deploy GitHub Pages Demo

on:
  push:
    branches: [main]
    paths:
      - 'Jellyfin.Plugin.JellyfinHelper/PluginPages/**'
      - 'Jellyfin.Plugin.JellyfinHelper/i18n/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/prepare-demo-site.ps1'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Deploy step uses ${{ secrets.GITHUB_TOKEN }} explicitly; do not persist
          # the token in local git config to reduce blast radius of any repo-controlled step.
          persist-credentials: false

      - name: Prepare demo site
        shell: pwsh
        run: ./.github/scripts/prepare-demo-site.ps1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs
          # Keep existing pr-preview directories intact
          keep_files: true