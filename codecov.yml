# Codecov configuration. Without this file Codecov uses `target: auto`, which pins the patch requirement to the project's current (very high) coverage.

codecov:
  require_ci_to_pass: true
  notify:
    # All three buckets (Unit, Security, Performance) upload separately and Codecov merges them by commit.
    after_n_builds: 3
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "85...100"

  status:
    project:
      default:
        target: 90%
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 85%
        threshold: 1%
        if_ci_failed: error

# Keep PR comment concise; show project + patch deltas.
comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

# Coverage instrumentation counts test code and generated/build assets as "uncovered", which drags the number down and makes the patch target meaningless for PRs that only touch those.
ignore:
  - "Jellyfin.Plugin.JellyfinHelper.Tests/**"
  - "BuildTasks/**"
  - "test/e2e/**"
  - "docs/**"
  - "**/PluginPages/configPage.html"
