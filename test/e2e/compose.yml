# End-to-end test stack for the Jellyfin Helper plugin.
#
# Brings up a real Jellyfin 12.0-rc3 server with the freshly-built plugin DLL
# mounted in, plus mock Radarr/Sonarr/Seerr servers so the Arr/Seerr features
# can be exercised against realistic (green-path) responses instead of only the
# "unreachable" path.
#
# The Jellyfin image tag is pinned deliberately: the plugin targets ABI
# 12.0.0.0 (built against Jellyfin.Controller 12.0.0-rcrc3). The stable 10.x
# line would refuse to load the plugin. Do NOT bump this to `latest`.
#
# Paths are relative to this file (test/e2e/). The runner (scripts/run.sh)
# builds the plugin into ./runtime/plugin before `compose up`.

name: jellyfin-helper-e2e

services:
  jellyfin:
    image: jellyfin/jellyfin:12.0-rc3
    container_name: jfh-e2e-jellyfin
    # Run as the host-invoking user in CI so mounted config is writable.
    # Overridable via JELLYFIN_UID/GID (defaults keep it simple locally).
    user: "${JELLYFIN_UID:-0}:${JELLYFIN_GID:-0}"
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    environment:
      # Jellyfin honours these for headless-friendly startup.
      - JELLYFIN_PublishedServerUrl=http://localhost:${JELLYFIN_PORT:-8096}
      - TZ=UTC
    volumes:
      # Single writable /config mount. The runner stages the plugin INTO
      # ./runtime/config/plugins/<Name>_<Version>/ before startup, so there is
      # no overlapping read-only sub-mount (which broke Jellyfin's plugin-dir
      # marker write on startup).
      - ./runtime/config:/config
      - ./runtime/cache:/cache
      # Fake media library (mini clips generated by the media generator).
      - ./runtime/media:/media
    healthcheck:
      # Jellyfin exposes an unauthenticated /health endpoint that returns "Healthy".
      # Use curl if present, else wget — the RC image may ship only one of them.
      test:
        - CMD-SHELL
        - >-
          (curl -fsS http://localhost:8096/health 2>/dev/null ||
           wget -qO- http://localhost:8096/health 2>/dev/null) | grep -q Healthy || exit 1
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      mock-arr:
        condition: service_healthy
      mock-seerr:
        condition: service_healthy
    networks:
      - jfh

  mock-arr:
    # Serves both Radarr and Sonarr fake APIs (distinguished by path).
    build:
      context: ./mocks
      dockerfile: Dockerfile
    container_name: jfh-e2e-mock-arr
    command: ["node", "arr-server.js"]
    # Exposed to the host so host-side tests can hit the mock's test hooks.
    ports:
      - "${MOCK_ARR_PORT:-9000}:9000"
    environment:
      - PORT=9000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - jfh

  mock-seerr:
    build:
      context: ./mocks
      dockerfile: Dockerfile
    container_name: jfh-e2e-mock-seerr
    command: ["node", "seerr-server.js"]
    # Exposed to the host so global-setup can seed the Jellyfin user GUID.
    ports:
      - "${MOCK_SEERR_PORT:-5055}:5055"
    environment:
      - PORT=5055
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5055/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - jfh

networks:
  jfh:
    driver: bridge
