changelog: |-
  v3.0.0.0 — Major release for Jellyfin 12.0+

  - Smarter recommendations: a bigger neural net (4.5x more parameters), fairer cold-start for new users, and more diverse top picks (no more ten Marvel films in a row)
  - Faster scans on big libraries using Jellyfin 12 batch APIs
  - Fixed four train/score divergence bugs in the recommendation engine
  - Settings and Health redesigned into tidy cards; Arr tab redesigned with a single dropdown + Compare button and a live reachability indicator
  - Better on phones
  - Security: saved API keys are no longer sent back to the browser; backup downloads warn about stored credentials; credential-replacing imports are audit-logged
  - New end-to-end test suite runs the plugin inside a real Jellyfin 12 server on every change, and deliberately throws bad input at it to prove cleanup never deletes or touches anything outside your libraries
  - Breaking: requires Jellyfin 12.0 — users on Jellyfin 10.x should stay on v2.1.0.6
