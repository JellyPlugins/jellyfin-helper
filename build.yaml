changelog: |-
  v3.1.0.0 - Discovery works without external plugins

  - BREAKING: the Custom Tabs and File Transformation plugins are no longer needed; the Discovery Home tab and the script injection are built into the Helper
  - The tab registers natively against Jellyfin's tab strip and keeps a stable jfhTab deep link
  - Script injection happens at request time, so it survives web updates and works on read-only installs
  - Setup instructions removed from Settings because Discovery works out of the box once enabled
  - Tags older versions wrote to index.html are cleaned up on startup
  - Requires Jellyfin 12.4 - if you are on Jellyfin 10.x, stay on v2.1.0.6
