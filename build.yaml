changelog: |-
  v3.1.1.0 - Recommendation Engine V5, clearer Discovery and stronger parental checks

  - Note: Recommendation Engine V5 replaces existing learned and neural models and trains them again over the next scheduled runs with the recommendation task in Activate mode; media, watch history and settings stay intact
  - More relevant, varied personal Discovery lists filter weak matches and limit repeats from the same collection; Trakt keeps its source ordering
  - Popular suggestions without personal evidence are labeled honestly instead of showing a match percentage; unchecked availability shows an explanatory status instead of a Request button
  - Taste matching understands translated and combined genres, verified collection membership and missing metadata; recommendation reasons reflect the actual score
  - Discovery learns from cards you actually see, keeps requests and dismissals tied to the displayed suggestions, and distinguishes favorites or partial playback from completed viewing
  - Training uses the context from prediction time, and quality checks keep duplicate copies of the same title out of training and validation overlap
  - Restricted profiles exclude missing or unverified age ratings; requests recheck the current parental settings and rating-country policy
  - Playlist updates skip disabled, removed or unverifiable users; compact touch controls avoid iOS focus zoom without oversized checkboxes or forced button heights
  - Verified by 95% backend unit test coverage, 97% UI test coverage, and 406 end-to-end Docker tests
  - Requires Jellyfin 12.4
