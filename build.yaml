changelog: >-
  v3.0.0.0: Compatible with Jellyfin 12.0. Upgraded to .NET 10 and Jellyfin.Controller/Model 12.0.0-rc2. Adopted .NET 10 CA1873 pattern (guarded logging) for all diagnostic hot paths. New JF12 batch APIs: IUserDataManager.GetUserDataBatch replaces per-item GetUserData loops in WatchHistoryService and UserActivityInsightsService (O(items x users) -> O(users) DB roundtrips). ILibraryManager.GetPeopleNamesByItems replaces per-item GetPeople calls in the recommendation scoring hot path. Shared BatchFallbackHelper enforces a single try-batch/fall-back-per-item contract across all three call sites (cancellation propagates, non-fatal exceptions degrade gracefully). Requires Jellyfin 12.0+; users on Jellyfin 10.x should stay on v2.1.0.5. 2398 tests.
