changelog: |-
  v3.0.0.5 - Discovery tab no longer goes blank on Jellyfin 12

  - The Seerr Discovery custom tab reliably shows its content again on Jellyfin 12: navigating away and back no longer leaves it blank. The script now only ever fills the panel the Custom Tabs plugin provides, instead of building a competing one, so the two never fight over the same spot
  - Returning to the tab is instant and never flashes a spinner: the last results render immediately from memory, and newer suggestions are swapped in silently in the background when a scheduled run has produced them
  - The sidebar "Seerr Discovery" link now opens the tab correctly on the modern Jellyfin 12 layout (both the top header and the narrow-screen menu), as well as on the classic layout
  - End-to-end tests now run the real Custom Tabs and File Transformation plugins and repeatedly navigate in and out of the Discovery tab to prove it never goes blank
  - Radarr/Sonarr instances behind a reverse proxy with a private CA, self-signed, or IP certificate can now connect via a per-instance "Skip certificate validation" checkbox in Settings (connection tests, comparison, and discovery exclusions honor it; validation stays on everywhere else)
  - Free Trakt accounts can now use Trakt discovery alongside the official Trakt plugin without hitting Trakt's one-app-per-account limit: when the official plugin is installed, the Helper sources your personal recommendations through its connection instead of registering a second app. Your own Trakt app still takes precedence if you configure one (e.g. Trakt VIP)
  - Hardening: API keys, the log filter, and backup credentials now reject hidden control characters that could cause errors or log tampering; odd-charset responses are read safely; and restoring a backup that disables TLS validation now warns you first
  - Tested by 6678 unit tests (expanded security, hardening, and performance coverage) and 363 end-to-end tests
  - Requires Jellyfin 12.2 - if you are on Jellyfin 10.x, stay on v2.1.0.6
  - Special thanks to @TheColin21 (https://github.com/TheColin21) for testing and donation ❤️
  - Special thanks to Daniel for his donation ❤️
