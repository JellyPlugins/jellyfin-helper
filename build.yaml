changelog: |-
  v3.1.0.1 - More accessible dashboard, reliable Discovery and safer cleanup

  - Navigate dashboard and Discovery tabs by keyboard; dialogs contain focus, close with Escape and restore the opener
  - Cleaner Discovery cards: open descriptions directly from the poster by click, tap or keyboard, without a separate Details button
  - Better touch targets, light-mode contrast and reduced-motion support; notifications pause while you read them and can be closed
  - Discovery appears after login and disappears on logout without a refresh; fast user switching cannot show stale results
  - Background refreshes keep open descriptions, focus and request dialogs; requested or dismissed titles do not reappear in the current session's other Discovery sources
  - Empty-folder trash moves count correctly; folder browsing and trash checks reject links into protected paths, and failed saves restore the trash-path confirmation
  - Recommendation retraining preserves score scaling and only promotes models using effective training examples and independent quality checks
  - Verified by 94% backend unit test coverage, 97% UI test coverage, and 404 end-to-end Docker tests
  - Requires Jellyfin 12.4 - if you are on Jellyfin 10.x, stay on v2.1.0.6
