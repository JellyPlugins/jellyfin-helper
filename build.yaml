changelog: |-
  v3.0.0.3 - Video bitrate breakdown in the Codecs tab

  - The Codecs tab now shows a Video Bitrate donut: your movies and shows grouped into bitrate tiers (< 2, 2-5, 5-10, 10-20, 20-40, > 40 Mbps), so you can see at a glance how much of your library is heavily compressed versus near-source quality
  - Click any tier to drill down to the exact files in it, the same way the codec and resolution breakdowns already work
  - Each tier uses the bitrate Jellyfin measured for the video stream; when a file has no per-stream value, the average bitrate is estimated from its size and runtime, so almost every file lands in a real tier instead of Unknown
  - Only video libraries (Movies, TV Shows and Other) are included; music is left out
  - Tested by 5561 unit tests and 320 end-to-end tests
  - Requires Jellyfin 12.0 - if you are on Jellyfin 10.x, stay on v2.1.0.6
